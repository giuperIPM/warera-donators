[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "warera-rankings"
version = "0.1.0"
description = "Classifiche delle donazioni agli Stati di WarEra"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
image = ["jinja2>=3.1.6,<4", "playwright>=1.55,<2"]

[project.scripts]
warera-rankings = "warera_rankings.job:main"
warera-ranking-image = "warera_rankings.image:main"

[tool.setuptools.package-data]
warera_rankings = ["templates/*.html"]

[tool.setuptools.packages.find]
include = ["warera_rankings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
